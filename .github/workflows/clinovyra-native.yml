name: Clinovyra native test builds

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'native/**'
      - 'native-print.js'
      - 'app.js'
      - 'emr.js'
      - 'quick-note.js'
      - 'styles.css'
      - 'index.html'
      - '.github/workflows/clinovyra-native.yml'

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: native
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - run: npm ci --no-audit --no-fund
      - run: npm run android:init
      - run: bash ./gradlew assembleDebug
        working-directory: native/android
      - uses: actions/upload-artifact@v4
        with:
          name: Clinovyra-Android-debug
          path: native/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: native
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - run: npm run desktop:win
      - uses: actions/upload-artifact@v4
        with:
          name: Clinovyra-Windows-unsigned
          path: native/dist/*.exe
          if-no-files-found: error

  ios-simulator:
    runs-on: macos-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: native
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - run: npm run ios:init
      - run: xcodebuild -project ios/App/App.xcodeproj -scheme App -destination 'generic/platform=iOS Simulator' -derivedDataPath ios-derived CODE_SIGNING_ALLOWED=NO build
