name: Clinovyra native test builds

on:
  workflow_dispatch:
  pull_request:
    types: [labeled]

permissions:
  contents: read

jobs:
  android:
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'native-ready'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: native
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
      - run: npm ci --no-audit --no-fund
      - run: npm run android:init
      - run: bash ./gradlew assembleDebug
        working-directory: native/android
      - uses: actions/upload-artifact@v4
        with:
          name: Clinovyra-Android-debug
          path: native/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  windows:
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'native-ready'
    runs-on: windows-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: native
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - run: npm run desktop:win
      - uses: actions/upload-artifact@v4
        with:
          name: Clinovyra-Windows-unsigned
          path: native/dist/*.exe
          if-no-files-found: error

  ios-simulator:
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'native-ready'
    runs-on: macos-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: native
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - run: npm run ios:init
      - run: xcodebuild -project ios/App/App.xcodeproj -scheme App -destination 'generic/platform=iOS Simulator' -derivedDataPath ios-derived-sim CODE_SIGNING_ALLOWED=NO build
      - run: xcodebuild -project ios/App/App.xcodeproj -scheme App -destination 'generic/platform=iOS' -derivedDataPath ios-derived-device CODE_SIGNING_ALLOWED=NO build
      - name: Package unsigned iPhone IPA for local signing
        run: |
          mkdir -p ios-unsigned/Payload
          cp -R ios-derived-device/Build/Products/Debug-iphoneos/App.app ios-unsigned/Payload/
          (cd ios-unsigned && zip -qry ../Clinovyra-iPhone-unsigned.ipa Payload)
          unzip -t Clinovyra-iPhone-unsigned.ipa | tail -1
      - uses: actions/upload-artifact@v4
        with:
          name: Clinovyra-iPhone-unsigned-IPA
          path: native/Clinovyra-iPhone-unsigned.ipa
          if-no-files-found: error
